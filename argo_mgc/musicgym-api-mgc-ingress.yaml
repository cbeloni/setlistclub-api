apiVersion: v1
kind: Service
metadata:
  name: musicgym-api-svc
spec:
  type: ClusterIP
  selector:
    app: musicgym-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: musicgym-api-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: musicgym-api.201.23.17.249.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: musicgym-api-svc
                port:
                  number: 80
    - host: musicgym-api.beloni.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: musicgym-api-svc
                port:
                  number: 80
